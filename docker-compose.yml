services:
  postgres:
    image: postgres:16-alpine
    container_name: applylog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: applylog
      POSTGRES_PASSWORD: applylog_secret
      POSTGRES_DB: applylog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applylog -d applylog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: applylog_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: applylog_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://applylog:applylog_secret@postgres:5432/applylog_db?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: super_secret_jwt_key_applylog_2026_change_in_prod
      JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_applylog_2026_change_in_prod
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: applylog_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://applylog:applylog_secret@postgres:5432/applylog_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_applylog_2026_change_in_prod
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: applylog_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backend_uploads:
